<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מפת בדיקות מעליות</title>

  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MarkerCluster: אשכולות סימונים כשיש הרבה -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger:  #dc2626;
      --warning: #d97706;
      --bg:      #f1f5f9;
      --card:    #ffffff;
      --border:  #e2e8f0;
      --text:    #1e293b;
      --muted:   #64748b;
      --radius:  10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #fff; padding: 16px 28px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 500;
    }
    header .icon { font-size: 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p  { font-size: .82rem; opacity: .85; margin-top: 2px; }

    /* Filter bar */
    .toolbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center;
      gap: 10px; z-index: 400;
    }
    .toolbar .group { display: flex; align-items: center; gap: 6px; }
    .toolbar .sep { width: 1px; height: 26px; background: var(--border); margin: 0 4px; }
    .chip {
      padding: 7px 16px; border-radius: 99px; border: 1px solid var(--border);
      background: #f8fafc; color: var(--text); cursor: pointer;
      font-size: .85rem; font-weight: 600; transition: all .15s;
    }
    .chip:hover { border-color: var(--primary); }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .toolbar label { font-size: .78rem; font-weight: 600; color: var(--muted); }
    .toolbar input[type=date] {
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
      font-size: .82rem; background: #f8fafc; color: var(--text);
    }

    /* Layout */
    .layout { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; min-height: 0; }
    aside {
      width: 340px; background: var(--card); border-inline-start: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .aside-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .aside-head .count { font-size: 1.15rem; font-weight: 700; color: #1e3a8a; }
    .aside-head .sub { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    /* Legend pills */
    .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .legend span { font-size: .72rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.red { background: var(--danger); }
    .dot.orange { background: var(--warning); }
    .dot.blue { background: var(--primary); }
    .dot.green { background: var(--success); }

    .list { overflow-y: auto; flex: 1; }
    .item {
      padding: 12px 18px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
      display: flex; gap: 10px; transition: background .12s;
    }
    .item:hover { background: #f8fafc; }
    .item .bar { width: 4px; border-radius: 4px; flex-shrink: 0; }
    .item .info { flex: 1; min-width: 0; }
    .item .name { font-weight: 700; font-size: .9rem; }
    .item .addr { font-size: .78rem; color: var(--muted); margin-top: 1px; }
    .item .meta { font-size: .75rem; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
    .item .date { font-weight: 600; }
    .badge { padding: 1px 8px; border-radius: 99px; font-size: .7rem; font-weight: 600; }
    .badge.red { background: #fee2e2; color: #b91c1c; }
    .badge.orange { background: #fef3c7; color: #b45309; }
    .badge.blue { background: #dbeafe; color: #1d4ed8; }
    .badge.green { background: #dcfce7; color: #15803d; }

    /* Popup */
    .popup h3 { font-size: .95rem; margin-bottom: 6px; color: #1e3a8a; }
    .popup .row { font-size: .82rem; margin: 3px 0; }
    .popup .row b { color: var(--muted); font-weight: 600; }
    .popup .nav { margin-top: 8px; display: flex; gap: 8px; }
    .popup .nav a {
      font-size: .78rem; text-decoration: none; padding: 4px 10px; border-radius: 6px;
      background: var(--primary); color: #fff; font-weight: 600;
    }
    .popup .nav a.waze { background: #33ccff; }

    .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: .85rem; }

    @media (max-width: 780px) {
      .layout { flex-direction: column; }
      aside { width: 100%; height: 40%; border-inline-start: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <span class="icon">🛗</span>
    <div>
      <h1>מפת בדיקות מעליות</h1>
      <p>תצוגת בדיקות נדרשות על מפה · סינון לפי טווח תאריכים</p>
    </div>
  </header>

  <div class="toolbar">
    <div class="group" id="rangeChips">
      <button class="chip" data-range="today">היום</button>
      <button class="chip" data-range="week">השבוע</button>
      <button class="chip active" data-range="nextweek">השבוע הבא</button>
      <button class="chip" data-range="month">החודש</button>
      <button class="chip" data-range="all">הכל</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <label>מ־</label>
      <input type="date" id="fromDate" />
      <label>עד</label>
      <input type="date" id="toDate" />
      <button class="chip" id="applyCustom">החל טווח</button>
    </div>
  </div>

  <div class="layout">
    <div id="map"></div>
    <aside>
      <div class="aside-head">
        <div class="count" id="count">—</div>
        <div class="sub" id="rangeLabel"></div>
        <div class="legend">
          <span><i class="dot red"></i> באיחור</span>
          <span><i class="dot orange"></i> תוך 7 ימים</span>
          <span><i class="dot blue"></i> תוך 30 יום</span>
          <span><i class="dot green"></i> מאוחר יותר</span>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
  </div>

  <script>
  /* ================================================================
     נתוני דוגמה — בפרודקשן זה יגיע מ-endpoint של ה-.NET כ-JSON.
     ראה .claude/skills/elevator-map/SKILL.md לחיבור לנתונים אמיתיים.
     התאריכים מחושבים יחסית ל"היום" כדי שהסינון תמיד יציג משהו.
  ================================================================= */
  const today = new Date(); today.setHours(0,0,0,0);
  const d = (offsetDays) => {
    const t = new Date(today); t.setDate(t.getDate() + offsetDays);
    return t.toISOString().slice(0,10);
  };

  const INSPECTIONS = [
    { id: 1,  customer: "מגדלי הצעירים",        address: "דיזנגוף 50, תל אביב",        lat: 32.0785, lng: 34.7748, date: d(-9), inspector: "אבי כהן",    status: "נדרשת" },
    { id: 2,  customer: "בית חולים איכילוב",     address: "ויצמן 6, תל אביב",           lat: 32.0800, lng: 34.7910, date: d(-2), inspector: "רונית לוי",  status: "נדרשת" },
    { id: 3,  customer: "קניון עזריאלי",         address: "דרך מנחם בגין 132, תל אביב",  lat: 32.0742, lng: 34.7920, date: d(1),  inspector: "אבי כהן",    status: "מתוזמנת" },
    { id: 4,  customer: "עיריית רמת גן",         address: "המעגל 26, רמת גן",           lat: 32.0684, lng: 34.8248, date: d(3),  inspector: "משה דהן",    status: "מתוזמנת" },
    { id: 5,  customer: "מלון דן פנורמה",        address: "טיילת הרברט סמואל, תל אביב",   lat: 32.0650, lng: 34.7630, date: d(5),  inspector: "רונית לוי",  status: "מתוזמנת" },
    { id: 6,  customer: "בית משרדים הרצליה",     address: "מדינת היהודים 89, הרצליה",    lat: 32.1620, lng: 34.8110, date: d(8),  inspector: "משה דהן",    status: "מתוזמנת" },
    { id: 7,  customer: "מרכז רפואי רבין",        address: "זבוטינסקי 39, פתח תקווה",     lat: 32.0870, lng: 34.8560, date: d(9),  inspector: "אבי כהן",    status: "מתוזמנת" },
    { id: 8,  customer: "מגדל BSR",              address: "מצדה 7, בני ברק",            lat: 32.0830, lng: 34.8010, date: d(11), inspector: "רונית לוי",  status: "מתוזמנת" },
    { id: 9,  customer: "אוניברסיטת בר אילן",    address: "רמת גן",                     lat: 32.0690, lng: 34.8430, date: d(12), inspector: "משה דהן",    status: "מתוזמנת" },
    { id: 10, customer: "קניון הזהב",            address: "אבא הלל סילבר 16, ראשל\"צ",   lat: 31.9640, lng: 34.8010, date: d(14), inspector: "אבי כהן",    status: "מתוזמנת" },
    { id: 11, customer: "בית ספר יסודי הדר",     address: "הרצל 12, חיפה",              lat: 32.8156, lng: 34.9982, date: d(18), inspector: "יוסי בר",    status: "מתוזמנת" },
    { id: 12, customer: "מגדלי חוף הכרמל",       address: "שדרות בן גוריון 5, חיפה",     lat: 32.8100, lng: 34.9880, date: d(21), inspector: "יוסי בר",    status: "מתוזמנת" },
    { id: 13, customer: "מרכז מסחרי באר שבע",    address: "רגר 30, באר שבע",            lat: 31.2520, lng: 34.7910, date: d(24), inspector: "דנה פרץ",    status: "מתוזמנת" },
    { id: 14, customer: "מלון לאונרדו ירושלים",  address: "רחוב אגריפס 24, ירושלים",     lat: 31.7850, lng: 35.2100, date: d(27), inspector: "דנה פרץ",    status: "מתוזמנת" },
    { id: 15, customer: "בניין העירייה נתניה",    address: "הצורן 1, נתניה",             lat: 32.3210, lng: 34.8530, date: d(40), inspector: "יוסי בר",    status: "מתוזמנת" }
  ];

  /* ---------- לוגיקת דחיפות וצבע ---------- */
  function daysUntil(dateStr) {
    const t = new Date(dateStr); t.setHours(0,0,0,0);
    return Math.round((t - today) / 86400000);
  }
  function urgency(dateStr) {
    const n = daysUntil(dateStr);
    if (n < 0)   return { key: "red",    color: "#dc2626", label: "באיחור" };
    if (n <= 7)  return { key: "orange", color: "#d97706", label: "תוך שבוע" };
    if (n <= 30) return { key: "blue",   color: "#2563eb", label: "תוך חודש" };
    return              { key: "green",  color: "#16a34a", label: "עתידי" };
  }
  function fmtDate(dateStr) {
    return new Date(dateStr).toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function relLabel(dateStr) {
    const n = daysUntil(dateStr);
    if (n === 0) return "היום";
    if (n === 1) return "מחר";
    if (n < 0)   return `לפני ${Math.abs(n)} ימים`;
    return `בעוד ${n} ימים`;
  }

  /* ---------- מפה ---------- */
  const map = L.map("map").setView([32.0, 34.85], 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap', maxZoom: 19
  }).addTo(map);
  const cluster = L.markerClusterGroup();
  map.addLayer(cluster);

  function coloredIcon(color) {
    return L.divIcon({
      className: "",
      html: `<div style="background:${color};width:22px;height:22px;border-radius:50% 50% 50% 0;
             transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
      iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -20]
    });
  }

  const markers = {}; // id -> marker

  /* ---------- טווחי תאריכים ---------- */
  function rangeFor(kind) {
    const start = new Date(today), end = new Date(today);
    const dow = today.getDay(); // 0=ראשון (תחילת שבוע בישראל)
    if (kind === "today") { /* start=end=today */ }
    else if (kind === "week")     { start.setDate(today.getDate() - dow); end.setDate(start.getDate() + 6); }
    else if (kind === "nextweek") { start.setDate(today.getDate() - dow + 7); end.setDate(start.getDate() + 6); }
    else if (kind === "month")    { end.setMonth(today.getMonth() + 1); }
    else if (kind === "all")      { return { start: null, end: null, name: "כל הבדיקות" }; }
    const names = { today: "היום", week: "השבוע הנוכחי", nextweek: "השבוע הבא", month: "30 הימים הקרובים" };
    return { start, end, name: names[kind] };
  }

  let current = rangeFor("nextweek");

  function inRange(dateStr, r) {
    if (!r.start) return true;
    const t = new Date(dateStr); t.setHours(0,0,0,0);
    return t >= r.start && t <= r.end;
  }

  /* ---------- ציור מחדש ---------- */
  function render() {
    cluster.clearLayers();
    Object.keys(markers).forEach(k => delete markers[k]);
    const listEl = document.getElementById("list");
    listEl.innerHTML = "";

    const rows = INSPECTIONS
      .filter(x => inRange(x.date, current))
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    document.getElementById("count").textContent = `${rows.length} בדיקות`;
    document.getElementById("rangeLabel").textContent = current.name +
      (current.start ? ` · ${fmtDate(current.start.toISOString())} – ${fmtDate(current.end.toISOString())}` : "");

    if (!rows.length) {
      listEl.innerHTML = '<div class="empty">אין בדיקות בטווח שנבחר</div>';
      return;
    }

    const bounds = [];
    rows.forEach(x => {
      const u = urgency(x.date);
      const m = L.marker([x.lat, x.lng], { icon: coloredIcon(u.color) });
      m.bindPopup(`
        <div class="popup">
          <h3>${x.customer}</h3>
          <div class="row"><b>כתובת:</b> ${x.address}</div>
          <div class="row"><b>תאריך בדיקה:</b> ${fmtDate(x.date)} <span style="color:${u.color};font-weight:600">(${relLabel(x.date)})</span></div>
          <div class="row"><b>בודק:</b> ${x.inspector}</div>
          <div class="row"><b>סטטוס:</b> ${x.status}</div>
          <div class="nav">
            <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lng}">ניווט Google</a>
            <a class="waze" target="_blank" href="https://waze.com/ul?ll=${x.lat},${x.lng}&navigate=yes">Waze</a>
          </div>
        </div>`);
      cluster.addLayer(m);
      markers[x.id] = m;
      bounds.push([x.lat, x.lng]);

      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div class="bar" style="background:${u.color}"></div>
        <div class="info">
          <div class="name">${x.customer}</div>
          <div class="addr">${x.address}</div>
          <div class="meta">
            <span class="date">${fmtDate(x.date)}</span>
            <span class="badge ${u.key}">${relLabel(x.date)}</span>
          </div>
        </div>`;
      item.onclick = () => {
        map.setView([x.lat, x.lng], 14);
        cluster.zoomToShowLayer(m, () => m.openPopup());
      };
      listEl.appendChild(item);
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });
  }

  /* ---------- אירועים ---------- */
  document.querySelectorAll("#rangeChips .chip").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("#rangeChips .chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      current = rangeFor(btn.dataset.range);
      document.getElementById("fromDate").value = "";
      document.getElementById("toDate").value = "";
      render();
    };
  });

  document.getElementById("applyCustom").onclick = () => {
    const f = document.getElementById("fromDate").value;
    const t = document.getElementById("toDate").value;
    if (!f || !t) { alert("בחר תאריך התחלה וסיום"); return; }
    document.querySelectorAll("#rangeChips .chip").forEach(b => b.classList.remove("active"));
    const s = new Date(f), e = new Date(t); s.setHours(0,0,0,0); e.setHours(0,0,0,0);
    current = { start: s, end: e, name: "טווח מותאם" };
    render();
  };

  render();
  </script>
</body>
</html>
